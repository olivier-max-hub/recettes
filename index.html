<style>
:root{--deco:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='260'%20height='260'%20viewBox='0%200%20260%20260'%20fill='none'%20stroke-width='3'%20stroke-linecap='round'%20stroke-linejoin='round'%20opacity='.6'%3E%3Cg%20transform='translate%2840%2050%29%20rotate%28-30%29'%20stroke='%237fc4cf'%3E%3Cellipse%20rx='11'%20ry='16'/%3E%3Cpath%20d='M0%2016V62'/%3E%3C/g%3E%3Cg%20transform='translate%28150%2040%29%20rotate%2825%29'%20stroke='%23f0b09c'%3E%3Cpath%20d='M-9-16v14q0%208%209%208t9-8v-14M0-16v22M0%206v46'/%3E%3C/g%3E%3Cg%20transform='translate%28222%20125%29%20rotate%28-15%29'%20stroke='%23efcf72'%3E%3Cpath%20d='M0%200C-18%2020-18%2048%200%2058C18%2048%2018%2020%200%200ZM0%200C-7%2020-7%2048%200%2058C7%2048%207%2020%200%200M0-28V0'/%3E%3C/g%3E%3Cg%20transform='translate%2878%20140%29'%20stroke='%239ccf92'%3E%3Cpath%20d='M-24%2022h48v14h-48zM-24%2022C-42%2018-40-8-18-6C-14-24%2014-24%2018-6C40-8%2042%2018%2024%2022'/%3E%3C/g%3E%3Cg%20transform='translate%28175%20215%29'%20stroke='%23b7a6e0'%3E%3Cpath%20d='M-24%200h48v26h-48zM-24%208h-10M24%208h10M-14-6h28'/%3E%3C/g%3E%3Cg%20transform='translate%2852%20222%29%20rotate%2820%29'%20stroke='%23f0a8c4'%3E%3Crect%20x='-22'%20y='-8'%20width='44'%20height='16'%20rx='6'/%3E%3Cpath%20d='M-34%200h12M22%200h12'/%3E%3C/g%3E%3Cg%20transform='translate%28120%20100%29%20rotate%2840%29'%20stroke='%238fd0b8'%3E%3Cpath%20d='M0-24v30M-6-24h12M0%206v22'/%3E%3Cpath%20d='M-5%206h10'/%3E%3C/g%3E%3C/svg%3E");--bg:#eef8fb;--g1:#f1fafc;--g2:#e6f6f7;--g3:#eaf5fb;--hdr:rgba(240,250,252,.88);--card:#fff;--ink:#1f2a24;--mute:#000;--line:#d3e6ea;--acc:#0f6b78;--on:#fff;color-scheme:only light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{font-size:112.5%;height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--deco) 0 0/260px 260px fixed,linear-gradient(160deg,var(--g1),var(--g2) 55%,var(--g3)) fixed,var(--bg);color:var(--ink);font:1rem/1.5 "Economica","Arial Narrow",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--acc);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--acc);color:#fff;padding:14px 16px 10px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.wrap{max-width:1100px;margin:0 auto}
h1{margin:0;color:#fff;font:700 1.9rem/1.1 "Economica","Arial Narrow",Arial,sans-serif}
.home{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-weight:700;font-size:.95rem;line-height:1.2;padding:4px 12px;margin:0 0 6px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4)}
.home:focus-visible{outline:3px solid #fff;outline-offset:2px}
/* Petits textes : noirs et en gras (Economica fin est trop pâle en petit) */
small,.sub,.msg,.note,.legal,.hint{font-weight:700}
.sub{color:rgba(255,255,255,.88);font-size:.85rem;margin:2px 0 10px}
input[type=search]{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}
.chip{flex:none;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;padding:6px 14px;border-radius:99px;font:inherit;font-size:.9rem;cursor:pointer}
.chip[aria-pressed=true]{background:#e3f6f8;color:#0b4f59;border-color:#e3f6f8;font-weight:600}
header .chip:focus-visible,header input:focus-visible{outline-color:#fff}
main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.1);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit}
.card:focus-visible,.chip:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.thumb{aspect-ratio:4/3;display:grid;place-items:center;font-size:2.8rem;position:relative;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .t{padding:10px 12px 12px}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-3px)}}
.card b{display:block;font:600 .98rem/1.25 "Economica","Arial Narrow",Arial,sans-serif}
.card small{color:var(--mute)}
.cinfo{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:8px -4px 0}
.cinfo .ci:last-child:nth-child(odd){grid-column:1/-1}
.ci{border-radius:10px;padding:4px 4px 5px;text-align:center;color:#0b4f59;display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0}
.ci .k{font-size:.58rem;letter-spacing:0;text-transform:uppercase;line-height:1.1;color:#000;font-weight:700}
.ci .v{font-weight:700;font-size:1.02rem;line-height:1.1;overflow-wrap:anywhere}
.ci .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
h2{font:600 1.15rem "Economica","Arial Narrow",Arial,sans-serif;margin:22px 0 10px;display:inline-block;padding:4px 14px;border-left:6px solid var(--cat,var(--acc));border-radius:6px;background:var(--card)}
.msg{padding:24px 8px;color:var(--mute);max-width:60ch;margin:0 auto}
.msg code{background:var(--card);padding:1px 6px;border-radius:5px;word-break:break-all}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--on);padding:9px 22px;border-radius:99px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--acc)}
.cm{margin-top:18px;display:grid;gap:10px;justify-items:center}
.cm.open{justify-items:stretch;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:22px}
/* Commentaire replié : seul « Laisser un commentaire » est visible (même format sur toutes les pages Cookapli) */
.cm-toggle{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:6px 2px;font:700 1.2rem "Economica","Arial Narrow",Arial,sans-serif;color:var(--acc);text-decoration:underline;text-underline-offset:4px;cursor:pointer;text-align:left}
.cm.open .cm-toggle{justify-self:start;text-decoration:none}
.cm-toggle .chev{display:inline-block;transition:transform .2s}.cm.open .cm-toggle .chev{transform:rotate(180deg)}
.cm-body{display:grid;gap:10px}.cm-body[hidden]{display:none}
.cm-body .note:empty{display:none}
footer .cm p.cm-privacy a,.cm-privacy a{color:var(--acc);font-weight:700}
footer .cm p.cm-privacy,.cm-privacy{max-width:none;margin:4px 0 0;padding:10px 12px;background:#e3f6f8;border-left:4px solid var(--acc);border-radius:10px;color:#000;font-weight:700;font-size:.95rem;line-height:1.35;text-align:left}
footer .cm p.note{background:none;padding:0;text-align:left;max-width:none;margin:0}
.cm h4{margin:0;font:600 1.1rem "Economica","Arial Narrow",Arial,sans-serif}
.cm input,.cm textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:16px;font:inherit;background:#fff;color:var(--ink)}
.cm .btn{justify-self:start}
.cm .btn:disabled{opacity:.6;cursor:default}
.note{margin:0;color:var(--mute);font-size:.85rem}
.cm .note{color:#000}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
footer{padding:8px 16px 28px;color:#1f2a24;font-size:.95rem}
footer p{max-width:70ch;margin:0 auto;text-align:center;background:rgba(255,255,255,.75);padding:10px 14px;border-radius:10px}
footer .cm{font-size:1rem;color:var(--ink);max-width:560px;margin:8px auto 16px;text-align:left}
.chef{display:none;align-items:center;gap:8px;position:absolute;right:0;top:-6px;padding:5px 16px 5px 8px;background:#fff;color:var(--acc);font-weight:700;font-size:1.1rem;line-height:1;text-decoration:none;border-radius:99px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.chef svg{width:44px;height:44px;flex:none}
.chef:focus-visible{outline-color:#fff}
.chef[hidden]{display:none}
.chef-f{display:flex;position:fixed;top:auto;right:12px;bottom:calc(var(--bar) + 16px + env(safe-area-inset-bottom,0px));z-index:15;font-size:1rem;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;cursor:grab;border:2px solid var(--acc);box-shadow:0 3px 8px rgba(0,0,0,.35)}
.chef-f svg{width:38px;height:38px}
.chef-f:focus-visible{outline-color:var(--acc)}
@media (min-width:700px){.chef{display:flex}.chef-f{display:none}.chef[hidden]{display:none}}
header .wrap{position:relative}
#commentaire{scroll-margin-top:100px}
.cats{display:grid;gap:12px}
.catb{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:96px;padding:14px 22px;border-radius:24px;text-decoration:none;color:#0b4f59;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.catb b{display:block;font-size:1.75rem;line-height:1.1}
.catb small{font-size:1rem}
.catb .ill{font-size:3.4rem;line-height:1;flex:none}
.catb:focus-visible{outline:3px solid #0b4f59;outline-offset:2px}
.backbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
.cwrap{flex:1;min-width:0;display:flex;justify-content:center}
.cpill{flex:1;max-width:100%;text-align:center;font-size:1.4rem;line-height:1.15;color:#0b4f59;padding:8px 18px;border-radius:99px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.backbar .btn.alt{background:var(--acc);border-color:var(--acc);color:#fff}
@media (max-width:699px){#chips{display:none}}
:root{--bar:0px} /* barre « Partager » désactivée pour l'instant (à remettre plus tard sur l'accueil Cookapli) */
body{padding-bottom:var(--bar)}
#sharebar{position:fixed;left:0;right:0;bottom:0;z-index:12;height:calc(var(--bar) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:center;background:var(--acc);box-shadow:0 -2px 10px rgba(0,0,0,.15)}
#sharebar a{color:#fff;font-weight:700;font-size:1.1rem;line-height:1;text-align:center;text-decoration:underline;text-underline-offset:3px;padding:6px 24px}
#sharebar a:focus-visible{outline-color:#fff}
#sharebar[hidden]{display:none}
#recipe{padding:0 16px 16px}
.chefbtn{background:#fff1b8;color:#0b4f59;border-color:#e0c25a;font-weight:700}
.chefline{margin:0 0 12px}
/* boutons « Son » et « Enchaîner » du lecteur du chef : bien visibles quand ils sont activés */
.cv-modal .cv-opts .cv-ctl[aria-pressed="true"]{background:#0f6b78;border-color:#0f6b78;color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(15,107,120,.35)}
.cv-modal .cv-opts .cv-ctl[aria-pressed="false"]{background:#fff;border:1px dashed #9db4b9;color:#1f2a24;font-weight:400;box-shadow:none}
.rband{background:var(--acc);color:#fff;text-align:center;font-weight:700;font-size:1.3rem;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:22px 22px 8px 8px;margin-bottom:8px}
#recipe[hidden]{display:none}
body.view-recipe main,body.view-recipe #q,body.view-recipe #chips,body.view-recipe .sub{display:none}
.rbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
.rbar .chefrow{flex-basis:100%;display:flex;justify-content:center} /* « Voir la recette avec un chef » centré */
.coursesline{margin:12px 0 0}
.coursesline .btn.alt{background:#fff}
.rhero{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center;background:var(--pale,#eef8fb);border-radius:26px;padding:18px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.rhero.solo{grid-template-columns:1fr}
.rhero .rend{color:var(--acc);font-size:1.15rem;margin:6px 0 0}
.rhero h2{display:block;background:none;border:0;border-radius:0;padding:0;margin:0;text-align:center;font-size:2.3rem;line-height:1.1;color:var(--acc)}
.rhero p{margin:6px 0 0;text-align:center;color:var(--mute)}
.rhero img{width:100%;max-height:340px;object-fit:cover;border-radius:20px;display:block}
.rpills{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:14px 0}
.rpill{border-radius:20px;padding:10px 12px;text-align:center;color:#0b4f59}
.rpill small{display:block;font-size:.8rem;letter-spacing:.05em;color:#000;font-weight:700}
.rpill b{font-size:1.45rem;line-height:1.2}
.pers{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:2px}
.persbtn{width:34px;height:34px;border-radius:50%;border:2px solid #0b4f59;background:#fff;color:#0b4f59;font:700 1.3rem/1 Economica,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.persbtn:disabled{opacity:.35;cursor:default}
.persbtn:focus-visible{outline:3px solid #0f6b78;outline-offset:2px}
.persnote{margin:8px 0 0;color:#000;font-weight:700;font-size:.95rem}
.rsec h3{color:var(--acc);font-size:1.75rem;margin:20px 0 8px}
.rbox{background:#eef8fb;border-radius:22px;padding:16px 22px}
.rcols{column-count:2;column-gap:30px}
.rcols ul{margin:0 0 8px;padding-left:20px}
.rcols li{break-inside:avoid;margin:3px 0}
.rlabel{font-weight:700;margin:8px 0 4px;break-after:avoid}
.rsteps{background:#eef8fb;border-radius:22px;padding:16px 22px}
.rstep{display:flex;gap:12px;margin:0 0 14px}
.rnum{flex:none;width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700}
.rstep p{margin:3px 0 0}
.rnote{font-style:italic;margin:10px 0 0}
.rframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:22px;background:#fff}
@media (max-width:699px){.rhero{grid-template-columns:1fr}.rhero img{order:-1;max-height:260px}.rcols{column-count:1}}
#toast{position:fixed;left:50%;bottom:calc(var(--bar) + 20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,14px);width:min(520px,calc(100% - 32px));display:flex;align-items:center;gap:12px;background:#fff;color:#1f2a24;border:1px solid #d3e6ea;border-left:6px solid #0f6b78;border-radius:16px;padding:10px 12px;box-shadow:0 10px 28px rgba(15,107,120,.25);font-size:1.05rem;line-height:1.3;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast::before{content:"✓";flex:none;width:28px;height:28px;border-radius:50%;background:#0f6b78;color:#fff;display:grid;place-items:center;font-weight:700;font-size:1rem}
#toast.warn{border-left-color:#e07a4f}#toast.warn::before{content:"!";background:#e07a4f}
/* ===== Calories, végétarien, Équilibre alimentaire ===== */
:root{--vert:#1f7a43}
.ci.kc{background:var(--vert);color:#fff}.ci.kc .k{color:#fff}
.rpill.kc{background:var(--vert);color:#fff}
.veg{position:absolute;z-index:2;top:26px;right:8px;transform:rotate(28deg);background:var(--vert);color:#fff;font:700 .7rem/1 "Economica","Arial Narrow",Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:7px;border:1.5px solid rgba(255,255,255,.9);box-shadow:0 2px 6px rgba(0,0,0,.35);pointer-events:none;white-space:nowrap}
.vegrow{display:flex;justify-content:center;padding:6px 8px;background:#fff}
.vegtag{background:var(--vert);color:#fff;font:700 .72rem/1 "Economica","Arial Narrow",Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:5px 16px;border-radius:7px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.veg.big{font-size:1.05rem;padding:6px 18px;top:38px;right:14px;border-radius:9px;border-width:2px}
.rhero{position:relative;overflow:hidden}
.rimg{position:relative;overflow:hidden;border-radius:20px}
@media (max-width:699px){.rhero .rimg{order:-1}}
.card{position:relative}
.card.picked{outline:4px solid var(--vert);outline-offset:-2px}
.card.picked::after{content:"✓";position:absolute;top:8px;left:8px;z-index:3;width:34px;height:34px;border-radius:50%;background:var(--vert);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.2rem;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.btn.vbtn{background:var(--vert);border-color:var(--vert);color:#fff;font-weight:700}
.btn.vbtn:disabled{opacity:.55;cursor:default}
#pickgo{position:fixed;left:0;right:0;bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px));z-index:13;display:none;gap:10px;flex-wrap:wrap;justify-content:center;padding:10px 12px;background:rgba(255,255,255,.96);box-shadow:0 -2px 10px rgba(0,0,0,.12)}
body.picking:not(.view-recipe) #pickgo{display:flex}
body.picking main{padding-bottom:90px}
body.picking #chips{display:none}
.picksort{margin:0 0 12px;color:#000;font-weight:700;font-size:.95rem;text-align:center}
body.picking .chef-f{display:none}
.chip.chipeq{background:var(--vert);border-color:var(--vert);font-weight:700}
.catb.cateq{background:linear-gradient(135deg,#2e9a5a,var(--vert))!important;color:#fff}
.catb.cateq:focus-visible{outline-color:#fff}
#eq{padding:16px}
#eq[hidden]{display:none}
body.view-eq main,body.view-eq #q,body.view-eq #chips,body.view-eq .sub{display:none}
.eqwarn{max-width:640px;margin:0 auto 6px;background:#fff8e1;border:2px solid #e0c25a;border-radius:18px;padding:12px 16px}
.eqwarn b{display:block;font-size:1.15rem;color:#7a5600}
.eqwarn p{margin:4px 0 0}
h3.eqh{max-width:640px;margin:18px auto 10px;color:var(--acc);font-size:1.6rem}
.eqmenu{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;max-width:640px;margin:0 auto}
.eqrow{display:flex;gap:8px;align-items:center}
.eqt{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:96px;padding:14px 22px;border-radius:24px;text-decoration:none;color:#0b4f59;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.eqt b{display:block;font-size:1.75rem;line-height:1.1;overflow-wrap:break-word}
.cpill.eqp{font-size:1.15rem}
@media (max-width:420px){.eqt b{font-size:1.55rem}.eqt .ill{font-size:2.8rem}}
.eqt small{display:block;font-size:1rem;color:#000;font-weight:700}
.eqt .lab{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:#000;font-weight:700}
.eqt .kc{display:inline-block;margin-top:6px;background:var(--vert);color:#fff;font-weight:700;padding:3px 12px;border-radius:99px}
.eqt .chg{font-size:.85rem;margin-top:2px}
.eqt .ill{font-size:3.4rem;line-height:1;flex:none}

function route(){var h=decodeURIComponent(location.hash.slice(1));

    if(!cn0){if(recipes.length){toast("Rubrique introuvable : impossible de choisir ce plat pour le moment.");location.replace("#equilibre")}return}

    if(cn&&cat!==cn.name){track("categorie",cn.name);cat=cn.name;renderChips();renderList();toTop()}return}

    if(isMobile()&&cat!=="Tout"){cat="Tout";renderChips();renderList();toTop()}return}
